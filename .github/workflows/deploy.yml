name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/taf86/pantry
  PUBLIC_URL: https://pantry.davidecasadei.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ github.sha }}
        run: docker buildx bake --push

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          ssh -i ~/.ssh/ci_key \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" "$GITHUB_SHA"

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            "$PUBLIC_URL/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
