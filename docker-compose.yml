name: pantry

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:?manca in .env}
  POSTGRES_DB: ${POSTGRES_DB:?manca in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca in .env}

services:
  db:
    image: postgres:17.5
    container_name: pantry-db
    restart: unless-stopped
    logging: *logging
    environment: *postgres-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ${IMAGE_REPO:?manca in .env}-api:${TAG:?manca in .env o .env.tag}
    restart: unless-stopped
    logging: *logging
    init: true
    stop_grace_period: 15s
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      NODE_ENV: ${NODE_ENV:-production}
      DOMAIN: ${DOMAIN:?manca in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?manca in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${IMAGE_REPO:?manca in .env}-web:${TAG:?manca in .env o .env.tag}
    restart: unless-stopped
    logging: *logging
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:?manca in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  caddy_data:
  caddy_config:
